<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

<body>
  <!-- Vanta animated background sits behind everything -->

  <!-- Solar system is drawn on this transparent canvas by script.js -->
  <canvas id="space"></canvas>

  <header class="title">
    <h1>Solar System</h1>
    <p>Interactive 3D model</p>
  </header>

  <div class="controls panel">
    <div class="speed">
      <div class="speed-head">
        <label for="speed">Speed</label>
        <span id="speedVal">1.0×</span>
      </div>
      <input type="range" id="speed" min="0" max="5" step="0.1" value="1" />
    </div>
    <div class="divider"></div>
    <div class="buttons">
      <button id="pauseBtn" title="Pause">
        <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
      </button>
      <button id="orbitBtn" class="on" title="Toggle orbits">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="1.5" /></svg>
      </button>
      <button id="labelBtn" class="on" title="Toggle labels">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h10M5 17h7" /></svg>
      </button>
      <button id="resetBtn" title="Reset view">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4" /></svg>
      </button>
    </div>
  </div>

  <nav class="planet-bar panel" id="planetBar"></nav>

  <aside class="info panel" id="info">
    <button class="close" id="closeInfo" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
    <div class="info-head">
      <span class="info-dot" id="infoDot"></span>
      <span class="info-type" id="infoType"></span>
    </div>
    <h2 id="infoName"></h2>
    <p class="info-desc" id="infoDesc"></p>
    <dl class="stats" id="infoStats"></dl>
    <div class="fact">
      <span>Did you know?</span>
      <p id="infoFact"></p>
    </div>
  </aside>

  <p class="hint" id="hint">Click a planet</p>

  <!-- Vanta.js background (free, loaded from CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.dots.min.js"></script>
  <script>
    VANTA.DOTS({ el: "#vanta-bg", mouseControls: true, touchControls: true, minHeight: 200, minWidth: 200, backgroundColor: 0xe17808, color: 0xffffff, color2: 0x8888ff, size: 3, spacing: 25, showLines: false });
  </script>

  <script src="script.js"></script>
  <div class="glass-form" id="glassForm">
    <form id="birthForm">
        <h2>Birth Details</h2>
        <div class="gf-inputbox">
          <input type="text" id="fullName" name="fullname" required>
          <label>Full name</label>
        </div>
        <div class="gf-inputbox">
          <input type="tel" id="contactNumber" name="contact" required>
          <label>Contact no.</label>
        </div>
        <div class="gf-inputbox gf-fixed">
          <input type="text" id="dateOfBirth" name="dob" readonly required placeholder="DD/MM/YYYY">
          <label>Date of birth</label>
        </div>
        <div class="gf-inputbox gf-fixed">
          <input type="text" id="timeOfBirth" name="tob" readonly required placeholder="HH:MM AM">
          <label>Time of birth</label>
        </div>
        <div class="gf-inputbox">
          <input type="text" id="placeOfBirth" name="pob" required>
          <label>Place of birth</label>
        </div>
        <button type="submit">Submit</button>
        <p id="formMessage" class="form-msg"></p>
      </form>
  </div>

  
  <div class="cal-pop" id="calPop">
    <canvas id="calCanvas"></canvas>
  </div>

  <script>
  (() => {
    const pop = document.getElementById("calPop");
    const cvs = document.getElementById("calCanvas");
    const ctx = cvs.getContext("2d");
    const dobInput = document.querySelector('input[name="dob"]');

    const CW = 300, CH = 326, PAD = 16, HEAD_H = 56, WD_H = 28, CELL_H = 36;
    const GRID_Y = HEAD_H + WD_H;
    const CELL_W = (CW - PAD * 2) / 7;
    const YEAR_COLS = 3, YEAR_ROWS = 4, YEAR_H = 44;
    const YEAR_W = (CW - PAD * 2) / YEAR_COLS;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = CW * dpr; cvs.height = CH * dpr;
    cvs.style.width = CW + "px"; cvs.style.height = CH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const WEEK = ["Su","Mo","Tu","We","Th","Fr","Sa"];
    const now = new Date();
    const S = {
      year: now.getFullYear(), month: now.getMonth(), sel: null,
      open: 0, openTarget: 0, slide: 0, pulse: 0,
      view: "days", mix: 0, mixTarget: 0, yearStart: now.getFullYear() - 5,
      hover: -1, hoverYear: -1, hoverNav: 0, running: false,
      indDay: { x: 0, y: 0, a: 0, ready: false },
      indYear: { x: 0, y: 0, a: 0, ready: false }
    };

    const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
    const firstDay = (y, m) => new Date(y, m, 1).getDay();
    const cellPos = i => ({ x: PAD + (i % 7) * CELL_W, y: GRID_Y + Math.floor(i / 7) * CELL_H });
    const dayAt = i => { const d = i - firstDay(S.year, S.month) + 1; return d >= 1 && d <= daysIn(S.year, S.month) ? d : 0; };
    const pad2 = n => String(n).padStart(2, "0");

    function hitCell(x, y) {
      if (y < GRID_Y || y > GRID_Y + 6 * CELL_H || x < PAD) return -1;
      const col = Math.floor((x - PAD) / CELL_W), row = Math.floor((y - GRID_Y) / CELL_H);
      if (col < 0 || col > 6) return -1;
      return row * 7 + col;
    }

    function yearPos(i) {
      return { x: PAD + (i % YEAR_COLS) * YEAR_W, y: GRID_Y + Math.floor(i / YEAR_COLS) * YEAR_H };
    }

    function hitYear(x, y) {
      if (y < GRID_Y || y > GRID_Y + YEAR_ROWS * YEAR_H || x < PAD || x > CW - PAD) return -1;
      const col = Math.min(YEAR_COLS - 1, Math.floor((x - PAD) / YEAR_W));
      const row = Math.floor((y - GRID_Y) / YEAR_H);
      return row * YEAR_COLS + col;
    }

    function dayTarget() {
      if (!S.sel || S.sel.y !== S.year || S.sel.m !== S.month) return null;
      const p = cellPos(firstDay(S.year, S.month) + S.sel.d - 1);
      return { x: p.x + CELL_W / 2, y: p.y + CELL_H / 2 };
    }

    function yearTarget() {
      const i = S.year - S.yearStart;
      if (i < 0 || i >= YEAR_COLS * YEAR_ROWS) return null;
      const p = yearPos(i);
      return { x: p.x + YEAR_W / 2, y: p.y + YEAR_H / 2 };
    }

    // Smoothly moves the highlight toward its target and fades it in or out
    function glide(k, t) {
      if (t && !k.ready) { k.x = t.x; k.y = t.y; k.ready = true; }
      if (t) { k.x += (t.x - k.x) * 0.25; k.y += (t.y - k.y) * 0.25; }
      k.a += ((t ? 1 : 0) - k.a) * 0.2;
    }

    function drawChevron(x, y, dir, hot) {
      ctx.save();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.globalAlpha *= hot ? 1 : 0.75;
      ctx.beginPath();
      ctx.moveTo(x - dir * 4, y - 7); ctx.lineTo(x + dir * 4, y); ctx.lineTo(x - dir * 4, y + 7);
      ctx.stroke();
      ctx.restore();
    }

    // Blue glowing highlight with a glass reflection
    function drawPill(k, w, h, base) {
      if (k.a < 0.01 || base < 0.01) return;
      const pr = 1 + S.pulse * 0.18, W = w * pr, H = h * pr;
      const g = ctx.createLinearGradient(0, k.y - H / 2, 0, k.y + H / 2);
      g.addColorStop(0, "#9ccaff"); g.addColorStop(0.55, "#3b82f6"); g.addColorStop(1, "#1e4fd0");
      ctx.save();
      ctx.globalAlpha = k.a * base;
      ctx.shadowColor = "rgba(59,130,246,0.9)"; ctx.shadowBlur = 18;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(k.x - W / 2, k.y - H / 2, W, H, 9); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath(); ctx.roundRect(k.x - W / 2 + 3, k.y - H / 2 + 3, W - 6, H * 0.42, 6); ctx.fill();
      ctx.restore();
    }

    function drawDays(base, o) {
      const today = new Date();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let i = 0; i < 42; i++) {
        const d = dayAt(i);
        if (!d) continue;
        const p = cellPos(i);
        const cx = p.x + CELL_W / 2, cy = p.y + CELL_H / 2;
        const sel = S.sel && S.sel.d === d && S.sel.m === S.month && S.sel.y === S.year;
        const enter = Math.max(0, Math.min(1, o * 1.6 - (i % 7) * 0.05 - Math.floor(i / 7) * 0.06));
        ctx.globalAlpha = enter * base;
        if (i === S.hover && !sel) {
          ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.font = (sel ? "600" : "400") + " 14px Inter, system-ui, sans-serif";
        ctx.fillStyle = "#fff";
        ctx.fillText(String(d), cx, cy);
        if (d === today.getDate() && S.month === today.getMonth() && S.year === today.getFullYear()) {
          ctx.fillStyle = "#7fb6ff";
          ctx.beginPath(); ctx.arc(cx, cy + 12, 2, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    function drawYears(base, o) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let i = 0; i < YEAR_COLS * YEAR_ROWS; i++) {
        const y = S.yearStart + i, p = yearPos(i);
        const cx = p.x + YEAR_W / 2, cy = p.y + YEAR_H / 2;
        const enter = Math.max(0, Math.min(1, o * 1.6 - (i % YEAR_COLS) * 0.05 - Math.floor(i / YEAR_COLS) * 0.06));
        const sel = y === S.year;
        ctx.globalAlpha = enter * base;
        if (i === S.hoverYear && !sel) {
          ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.roundRect(cx - 34, cy - 16, 68, 32, 9); ctx.stroke();
        }
        ctx.font = (sel ? "600" : "400") + " 15px Inter, system-ui, sans-serif";
        ctx.fillStyle = "#fff";
        ctx.fillText(String(y), cx, cy);
      }
    }

    function draw() {
      const o = S.open, m = S.mix, dayA = o * (1 - m), yearA = o * m;
      glide(S.indDay, dayTarget());
      glide(S.indYear, yearTarget());
      ctx.clearRect(0, 0, CW, CH);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";

      // Header: month title in day view, year range in year view
      ctx.fillStyle = "#fff";
      ctx.font = "600 16px Inter, system-ui, sans-serif";
      ctx.globalAlpha = dayA;
      ctx.fillText(MONTHS[S.month] + " " + S.year, CW / 2, 28);
      ctx.globalAlpha = yearA;
      ctx.fillText(S.yearStart + " - " + (S.yearStart + 11), CW / 2, 28);

      ctx.globalAlpha = o;
      drawChevron(PAD + 8, 28, -1, S.hoverNav === -1);
      drawChevron(CW - PAD - 8, 28, 1, S.hoverNav === 1);
      ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD, HEAD_H - 4); ctx.lineTo(CW - PAD, HEAD_H - 4); ctx.stroke();

      // Weekday row (day view only)
      if (dayA > 0.01) {
        ctx.font = "500 11px Inter, system-ui, sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.globalAlpha = dayA;
        WEEK.forEach((w, c) => ctx.fillText(w, PAD + c * CELL_W + CELL_W / 2, HEAD_H + WD_H / 2));
      }

      ctx.save();
      ctx.translate(S.slide, 0);
      if (dayA > 0.01) {
        drawPill(S.indDay, 34, 30, dayA);
        drawDays(dayA, o);
      }
      if (yearA > 0.01) {
        drawPill(S.indYear, 68, 32, yearA);
        drawYears(yearA, o);
      }
      ctx.restore();
    }

    function loop() {
      S.open += (S.openTarget - S.open) * 0.18;
      S.mix += (S.mixTarget - S.mix) * 0.15;
      S.slide += (0 - S.slide) * 0.2;
      S.pulse *= 0.9;
      draw();
      if (S.openTarget === 0 && S.open < 0.01) {
        S.open = 0; ctx.clearRect(0, 0, CW, CH); S.running = false; return;
      }
      requestAnimationFrame(loop);
    }

    function ensureLoop() {
      if (!S.running) { S.running = true; requestAnimationFrame(loop); }
    }

    function setView(v) {
      S.view = v;
      S.mixTarget = v === "years" ? 1 : 0;
      S.hoverYear = -1;
      ensureLoop();
    }

    function toggleView() {
      if (S.view === "days") { S.yearStart = S.year - 5; setView("years"); }
      else setView("days");
    }

    function openCal() {
      pop.classList.add("show");
      const r = dobInput.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left + r.width / 2 - pw / 2));
      let top = r.bottom + 10;
      if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 10);
      pop.style.left = left + "px"; pop.style.top = top + "px";
      if (S.sel) { S.year = S.sel.y; S.month = S.sel.m; }
      S.view = "days"; S.mixTarget = 0;
      S.openTarget = 1;
      ensureLoop();
    }

    function closeCal() {
      if (S.openTarget === 0) return;
      S.openTarget = 0;
      pop.classList.remove("show");
      ensureLoop();
    }

    function changeMonth(dir) {
      S.month += dir;
      if (S.month < 0) { S.month = 11; S.year--; }
      if (S.month > 11) { S.month = 0; S.year++; }
      S.slide = dir * 40;
      ensureLoop();
    }

    function step(dir) {
      if (S.view === "years") S.yearStart += dir * 12;
      else changeMonth(dir);
      ensureLoop();
    }

    function selectDay(d) {
      S.sel = { y: S.year, m: S.month, d };
      S.pulse = 1;
      dobInput.value = pad2(d) + "/" + pad2(S.month + 1) + "/" + S.year;
      ensureLoop();
      setTimeout(closeCal, 420);
    }

    cvs.addEventListener("pointermove", e => {
      const r = cvs.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      if (S.view === "years") {
        S.hoverYear = hitYear(x, y);
        S.hover = -1;
      } else {
        S.hover = hitCell(x, y);
        if (S.hover >= 0 && !dayAt(S.hover)) S.hover = -1;
      }
      S.hoverNav = y < HEAD_H ? (x < PAD + 40 ? -1 : x > CW - PAD - 40 ? 1 : 0) : 0;
      const onTitle = y < HEAD_H && x >= PAD + 40 && x <= CW - PAD - 40;
      const clickable = S.hover >= 0 || S.hoverYear >= 0 || S.hoverNav !== 0 || onTitle;
      cvs.style.cursor = clickable ? "pointer" : "default";
      ensureLoop();
    });

    cvs.addEventListener("pointerleave", () => {
      S.hover = -1; S.hoverYear = -1; S.hoverNav = 0; ensureLoop();
    });

    cvs.addEventListener("click", e => {
      const r = cvs.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      if (y < HEAD_H) {
        if (x < PAD + 40) step(-1);
        else if (x > CW - PAD - 40) step(1);
        else toggleView();
        return;
      }
      if (S.view === "years") {
        const i = hitYear(x, y);
        if (i >= 0) { S.year = S.yearStart + i; S.slide = 0; setView("days"); }
        return;
      }
      const i = hitCell(x, y);
      const d = i >= 0 ? dayAt(i) : 0;
      if (d) selectDay(d);
    });

    dobInput.addEventListener("click", e => { e.stopPropagation(); openCal(); });
    document.addEventListener("pointerdown", e => {
      if (!pop.contains(e.target) && e.target !== dobInput) closeCal();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeCal(); });
  })();
  </script>
  <div class="tp-overlay" id="tpOverlay">
    <div class="tp-card" id="tpCard">
      <h3>Time of birth</h3>
      <div class="tp-display">
        <div class="flap-cell" data-v="-"><div class="half top"><span>-</span></div><div class="half bottom"><span>-</span></div></div>
        <div class="flap-cell" data-v="-"><div class="half top"><span>-</span></div><div class="half bottom"><span>-</span></div></div>
        <div class="tp-colon">:</div>
        <div class="flap-cell" data-v="-"><div class="half top"><span>-</span></div><div class="half bottom"><span>-</span></div></div>
        <div class="flap-cell" data-v="-"><div class="half top"><span>-</span></div><div class="half bottom"><span>-</span></div></div>
        <div class="tp-period">
          <button type="button" class="per on" data-period="AM">AM</button>
          <button type="button" class="per" data-period="PM">PM</button>
        </div>
      </div>
      <p class="tp-status" id="tpStatus">Type 4 digits, e.g. 0930</p>
      <div class="tp-pad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" class="act" data-key="back">⌫</button>
        <button type="button" data-key="0">0</button>
        <button type="button" class="act" data-key="done">Done</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const tobInput = document.querySelector('input[name="tob"]');
    const overlay = document.getElementById("tpOverlay");
    const card = document.getElementById("tpCard");
    const statusEl = document.getElementById("tpStatus");
    const cells = [...overlay.querySelectorAll(".flap-cell")];
    const periodBtns = [...overlay.querySelectorAll(".per")];
    let digits = ["-", "-", "-", "-"];
    let period = "AM";
    let audioCtx = null;

    // Browsers only allow sound after a user action, so this runs on every interaction
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    // Mechanical key click: a short filtered noise burst plus a quick thump
    function playClick() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const len = Math.floor(audioCtx.sampleRate * 0.025);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 1500;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.6, t);
      noise.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination);
      noise.start(t);

      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(950, t);
      osc.frequency.exponentialRampToValueAtTime(240, t + 0.035);
      const og = audioCtx.createGain();
      og.gain.setValueAtTime(0.35, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(og); og.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.07);
    }

    function makeFlap(pos, ch) {
      const f = document.createElement("div");
      f.className = "flap " + pos;
      const s = document.createElement("span");
      s.textContent = ch;
      f.append(s);
      return f;
    }

    // Split-flap: the top half folds down, then the new bottom half falls into place
    function setCell(cell, ch, animate = true) {
      const cur = cell.dataset.v;
      if (cur === ch) return;
      cell.dataset.v = ch;
      const topSpan = cell.querySelector(".half.top span");
      const botSpan = cell.querySelector(".half.bottom span");
      if (!animate || reduced) {
        topSpan.textContent = ch;
        botSpan.textContent = ch;
        return;
      }
      const flapTop = makeFlap("top", cur);
      const flapBottom = makeFlap("bottom", ch);
      flapBottom.style.transform = "rotateX(90deg)";
      cell.append(flapTop, flapBottom);
      flapTop.animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(-90deg)" }],
        { duration: 140, easing: "ease-in", fill: "forwards" }).finished
        .then(() => {
          topSpan.textContent = ch;
          flapTop.remove();
          return flapBottom.animate([{ transform: "rotateX(90deg)" }, { transform: "rotateX(0deg)" }],
            { duration: 170, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }).finished;
        })
        .then(() => {
          botSpan.textContent = ch;
          flapBottom.remove();
        })
        .catch(() => {});
    }

    function render(animate = true) {
      cells.forEach((c, i) => setCell(c, digits[i], animate));
    }

    const isComplete = () => digits.every(d => d !== "-");

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = "tp-status " + kind;
    }

    function shake() {
      if (reduced) return;
      card.animate([
        { transform: "translateX(0)" }, { transform: "translateX(-9px)" },
        { transform: "translateX(9px)" }, { transform: "translateX(0)" }
      ], { duration: 320 });
    }

    function commit() {
      const h = parseInt(digits[0] + digits[1], 10);
      const m = parseInt(digits[2] + digits[3], 10);
      if (h < 1 || h > 12 || m > 59) {
        tobInput.value = "";
        setStatus("Hour must be 01-12 and minute 00-59", "bad");
        shake();
        setTimeout(() => { digits = ["-", "-", "-", "-"]; render(); }, 600);
        return false;
      }
      tobInput.value = `${digits[0]}${digits[1]}:${digits[2]}${digits[3]} ${period}`;
      setStatus("Set. Tap Done or press Enter.", "good");
      return true;
    }

    function setPeriod(p) {
      period = p;
      periodBtns.forEach(b => b.classList.toggle("on", b.dataset.period === p));
      if (isComplete()) commit();
    }

    function pushDigit(d) {
      const idx = digits.indexOf("-");
      if (idx < 0) return;
      ensureAudio();
      playClick();
      digits[idx] = d;
      render();
      if (isComplete()) {
        commit();
      } else {
        tobInput.value = "";
        setStatus((4 - digits.filter(x => x !== "-").length) + " digit(s) left");
      }
    }

    function popDigit() {
      let idx = -1;
      digits.forEach((d, i) => { if (d !== "-") idx = i; });
      if (idx < 0) return;
      ensureAudio();
      playClick();
      digits[idx] = "-";
      render();
      tobInput.value = "";
      setStatus("Type 4 digits, e.g. 0930");
    }

    function finish() {
      if (!isComplete()) {
        setStatus("Type all 4 digits first", "bad");
        shake();
        return;
      }
      if (commit()) closeTime();
    }

    function handleKey(k) {
      if (k === "back") popDigit();
      else if (k === "done") finish();
      else pushDigit(k);
    }

    function openTime() {
      ensureAudio();
      const m = tobInput.value.match(/^(\d)(\d):(\d)(\d) (AM|PM)$/);
      if (m) {
        digits = [m[1], m[2], m[3], m[4]];
        period = m[5];
      } else {
        digits = ["-", "-", "-", "-"];
        period = "AM";
      }
      periodBtns.forEach(b => b.classList.toggle("on", b.dataset.period === period));
      render(false);
      if (isComplete()) setStatus("Set. Tap Done or press Enter.", "good");
      else setStatus("Type 4 digits, e.g. 0930");
      overlay.classList.add("show");
    }

    function closeTime() {
      overlay.classList.remove("show");
    }

    tobInput.addEventListener("click", e => { e.stopPropagation(); openTime(); });
    overlay.addEventListener("pointerdown", e => { if (e.target === overlay) closeTime(); });
    overlay.querySelectorAll(".tp-pad button").forEach(b =>
      b.addEventListener("click", () => handleKey(b.dataset.key)));
    periodBtns.forEach(b =>
      b.addEventListener("click", () => { ensureAudio(); setPeriod(b.dataset.period); }));

    document.addEventListener("keydown", e => {
      if (!overlay.classList.contains("show")) return;
      if (/^\d$/.test(e.key)) { e.preventDefault(); handleKey(e.key); }
      else if (e.key === "Backspace") { e.preventDefault(); handleKey("back"); }
      else if (e.key === "Enter") { e.preventDefault(); handleKey("done"); }
      else if (e.key === "Escape") closeTime();
      else if (/^a$/i.test(e.key)) setPeriod("AM");
      else if (/^p$/i.test(e.key)) setPeriod("PM");
    });
  })();

  <script>
  (() => {
    const host = document.getElementById("svcColumn");
    if (!host || typeof THREE === "undefined") return;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const SERVICES = [
      { no: "01", title: "Janam Kundli", icon: "kundli",
        desc: "Your birth chart, drawn from your exact date, time and place of birth. It shows the planets across your 12 houses and your rising sign (Lagna).",
        small: "Panchang: Tithi, Vara, Nakshatra, Yoga, Karana" },
      { no: "02", title: "Vastu Paramarsh", icon: "vastu",
        desc: "Guidance on arranging your home or office using traditional Vastu principles: the eight directions and the balance of the five elements.",
        small: "The centre (Brahmasthan) is kept open and clear" },
      { no: "03", title: "Grah Dosh Nivaran", icon: "grah",
        desc: "Planetary remedies for challenges seen in your chart, such as mantra practice, charity and temple worship. These support your practice, not a guaranteed outcome.",
        small: "Nine planets (Navagraha) read from your birth chart" },
      { no: "04", title: "Ratan Salah", icon: "ratan",
        desc: "Advice on whether a planetary gemstone suits your chart, based on your birth details. Always consult an astrologer before wearing any gemstone.",
        small: "Nine gemstones (Navaratna), one for each planet" }
    ];

    const N = SERVICES.length, CARD_W = 1.08, CARD_H = 2.06, S = 2.3, HOLD = 2800;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    function wrapText(ctx, text, x, y, maxW, lh) {
      const words = text.split(" ");
      let line = "";
      for (const w of words) {
        const test = line + w + " ";
        if (ctx.measureText(test).width > maxW && line) {
          ctx.fillText(line.trim(), x, y);
          line = w + " ";
          y += lh;
        } else {
          line = test;
        }
      }
      ctx.fillText(line.trim(), x, y);
      return y + lh;
    }

    function drawIcon(ctx, kind, cx, cy, r) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (kind === "kundli") {
        ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.closePath();
        ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
        ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
      } else if (kind === "vastu") {
        ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
        for (let i = 1; i <= 2; i++) {
          const o = cx - r + (i * 2 * r) / 3;
          ctx.moveTo(o, cy - r); ctx.lineTo(o, cy + r);
          const q = cy - r + (i * 2 * r) / 3;
          ctx.moveTo(cx - r, q); ctx.lineTo(cx + r, q);
        }
      } else if (kind === "grah") {
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.moveTo(cx + r * 0.12, cy); ctx.arc(cx, cy, r * 0.12, 0, Math.PI * 2);
        for (let i = 0; i < 9; i++) {
          const a = (i * Math.PI * 2) / 9;
          const px = cx + Math.cos(a) * r * 0.7, py = cy + Math.sin(a) * r * 0.7;

        ctx.lineTo(cx - r * 0.5, cy + r * 0.8); ctx.lineTo(cx - r * 0.8, cy - r * 0.2); ctx.closePath();
        ctx.moveTo(cx - r * 0.8, cy - r * 0.2); ctx.lineTo(cx + r * 0.8, cy - r * 0.2);
        ctx.moveTo(cx, cy - r * 0.8); ctx.lineTo(cx - r * 0.5, cy + r * 0.8);
        ctx.moveTo(cx, cy - r * 0.8); ctx.lineTo(cx + r * 0.5, cy + r * 0.8);
      }

      ctx.restore();
    }

    function makeCardCanvas(s) {
      const W = 420, H = 808;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const x = c.getContext("2d");
      const body = x.createLinearGradient(0, 0, 0, H);
      body.addColorStop(0, "rgba(255,255,255,0.26)");
      body.addColorStop(1, "rgba(255,255,255,0.08)");
      x.fillStyle = body;
      x.beginPath(); x.roundRect(10, 10, W - 20, H - 20, 36); x.fill();
      x.lineWidth = 3; x.strokeStyle = "rgba(255,255,255,0.55)"; x.stroke();
      const shine = x.createLinearGradient(0, 10, 0, 250);
      shine.addColorStop(0, "rgba(255,255,255,0.22)");
      shine.addColorStop(1, "rgba(255,255,255,0)");
      x.fillStyle = shine;
      x.beginPath(); x.roundRect(10, 10, W - 20, 240, 36); x.fill();
      x.fillStyle = "#ffffff";
      x.font = "500 20px Inter, system-ui, sans-serif";
      x.fillText(s.no + " / 04", 40, 64);
      drawIcon(x, s.icon, 210, 190, 72);
      x.font = "600 32px Inter, system-ui, sans-serif";
      x.fillText(s.title, 40, 330);
      x.font = "400 18px Inter, system-ui, sans-serif";
      x.fillStyle = "rgba(255,255,255,0.92)";
      const y = wrapText(x, s.desc, 40, 372, 340, 27);
      x.font = "300 15px Inter, system-ui, sans-serif";
      x.fillStyle = "rgba(255,255,255,0.75)";
      wrapText(x, s.small, 40, Math.max(y + 8, 760), 340, 22);
      return c;
    }
    const NOISE = `
float h2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h2(i), h2(i + vec2(1.0, 0.0)), u.x), mix(h2(i + vec2(0.0, 1.0)), h2(i + vec2(1.0, 1.0)), u.x), u.y);
}`;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);

    const GX = 56, GY = 70, NP = GX * GY;

      for (let gx = 0; gx < GX; gx++) {

    dustGeo.setAttribute("position", new THREE.BufferAttribute(dPos, 3));

    const groups = [], cardMats = [], dustMats = [];
    SERVICES.forEach((s) => {

      const cm = new THREE.ShaderMaterial({

        uniforms: { uP: { value: 0 }, uSide: { value: 1 }, uSize: { value: sizeVec }, uPx: { value: 2 } },
        vertexShader: NOISE + `
          attribute vec2 aUv; attribute vec4 aRnd;
          uniform float uP; uniform float uSide; uniform vec2 uSize; uniform float uPx;
          varying float vA;
          void main() {
            float g = uSide > 0.0 ? 1.0 - aUv.y : aUv.y;
            float t = mix(g, vn(aUv * vec2(6.0, 8.0)), 0.45);

            gl_Position = projectionMatrix * modelViewMatrix * vec4(base + drift, 0.0, 1.0);
            gl_PointSize = uPx * (0.6 + 0.9 * aRnd.w) * (1.0 - 0.6 * e);
            vA = (1.0 - smoothstep(0.5, 1.0, e)) * 0.9;
          }`,
        fragmentShader: `
          varying float vA;
          void main() {
            float r = length(gl_PointCoord - 0.5);
            if (r > 0.5 || vA <= 0.0) discard;
            gl_FragColor = vec4(1.0, 0.92, 0.75, vA * (1.0 - r * 2.0));
          }`,
        transparent: true, depthWrite: false
      });
      const mesh = new THREE.Mesh(plane, cm);
      const dust = new THREE.Points(dustGeo, dm);
      dust.frustumCulled = false;
      const g = new THREE.Group();
      g.add(mesh, dust);
      scene.add(g);
      groups.push(g); cardMats.push(cm); dustMats.push(dm);
    });

    function resize() {
      const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      const px = renderer.getPixelRatio() * 2.2;
      dustMats.forEach((m) => { m.uniforms.uPx.value = px; });
    }
    new ResizeObserver(resize).observe(host);
    resize();

    let pos = 0, target = 0, dir = 1, arrivedAt = 0;
    let auto = !reduced, dragging = false, dragY = 0, dragPos = 0, wheelTimer = null;

    function stopAuto() { auto = false; }

    host.addEventListener("pointerdown", (e) => {
      stopAuto();
      dragging = true; dragY = e.clientY; dragPos = pos; target = pos;
      host.setPointerCapture(e.pointerId);

    host.addEventListener("pointerup", endDrag);

    function layout() {

        const d = i - pos, ad = Math.abs(d);

        const p = clamp((ad - 0.55) / 0.75, 0, 1);
        const side = d >= 0 ? 1 : -1;
        cardMats[i].uniforms.uP.value = p;
        cardMats[i].uniforms.uSide.value = side;
        dustMats[i].uniforms.uP.value = p;
        dustMats[i].uniforms.uSide.value = side;
      }
    }

    function tick(now) {
      if (auto && !dragging && Math.abs(target - pos) < 0.02) {
        if (!arrivedAt) arrivedAt = now;
        if (now - arrivedAt > HOLD) {
          arrivedAt = 0;
          if (target >= N - 1) dir = -1;
          else if (target <= 0) dir = 1;
          target = clamp(target + dir, 0, N - 1);
        }
      }
      if (!dragging) pos += (target - pos) * 0.07;
      layout();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  <script>
  (() => {
    const overlay = document.getElementById("loader");
    const canvas = document.getElementById("ldOrb");
    const label = document.getElementById("ldLabel");
    const ctx = canvas.getContext("2d");
    const SIZE = 46;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = SIZE * dpr;
    canvas.height = SIZE * dpr;
    canvas.style.width = SIZE + "px";
    canvas.style.height = SIZE + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const N = 150, PERIOD = 3.6, TAU = Math.PI * 2, FOCAL = 3.5;
    const DOT = "#F4F1EA";

    // Points spread evenly over a sphere (Fibonacci lattice)
    const PTS = [];
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = i * 2.399963;
      PTS.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r });
    }

    const clamp01 = u => Math.min(1, Math.max(0, u));

    // Spins the sphere around Y, then tilts it around X
    function rotate(p, ay, ax) {
      const ca = Math.cos(ay), sa = Math.sin(ay);
      const x1 = p.x * ca - p.z * sa;
      let z1 = p.x * sa + p.z * ca;
      const cb = Math.cos(ax), sb = Math.sin(ax);
      const y2 = p.y * cb - z1 * sb;
      z1 = p.y * sb + z1 * cb;
      return { x: x1, y: y2, z: z1 };
    }

    function draw(now) {
      requestAnimationFrame(draw);
      if (!overlay.classList.contains("show")) return;
      const t = reduced ? 0 : ((now / 1000) / PERIOD) % 1;
      const R = SIZE * 0.27, cx = SIZE / 2, cy = SIZE / 2;
      const items = [];
      for (const p0 of PTS) {
        // Each latitude swells slightly later than the one above it, so the swell travels down
        const m = 1 + 0.13 * Math.sin(TAU * (t - 0.22 * (p0.y + 1)));
        const p = rotate({ x: p0.x * m, y: p0.y * m, z: p0.z * m }, TAU * t, 0.36);
        const per = FOCAL / (FOCAL - p.z);
        const d = clamp01((p.z + 1.1) / 2.2);
        items.push({
          x: cx + p.x * R * per,
          y: cy + p.y * R * per,
          r: (0.6 + 1.4 * d) * per * 0.55,
          a: (0.07 + 0.93 * Math.pow(d, 1.55)) * 0.9,
          z: p.z
        });
      }
      items.sort((a, b) => a.z - b.z);
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.fillStyle = DOT;
      for (const it of items) {
        ctx.globalAlpha = Math.min(1, it.a);
        ctx.beginPath();
        ctx.arc(it.x, it.y, Math.max(it.r, 0.5), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(draw);

    // Keeps the loader on screen for at least 900 ms so it never just flickers
    let shownAt = performance.now();
    let hideTimer = null;
    window.Loader = {
      show(text) {
        clearTimeout(hideTimer);
        label.textContent = text || "Loading...";
        shownAt = performance.now();
        overlay.classList.add("show");
      },
      hide() {
        clearTimeout(hideTimer);
        const wait = Math.max(0, 900 - (performance.now() - shownAt));
        hideTimer = setTimeout(() => overlay.classList.remove("show"), wait);
      }
    };

    if (document.readyState === "complete") window.Loader.hide();
    else window.addEventListener("load", () => window.Loader.hide());
  })();
